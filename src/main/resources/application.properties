# ── Application ───────────────────────────────────────────────────────────────
spring.application.name=seat-reservation

# ── Datasource ────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/seatreservation}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=SeatReservationPool

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Schema initialisation (idempotent SQL) ────────────────────────────────────
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.separator=;;;

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100

# ── Actuator & Metrics ────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=prometheus,health,info,metrics
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:change-me-in-production-use-at-least-32-chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.seatreservation=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
